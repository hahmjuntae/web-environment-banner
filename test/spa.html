<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SPA 라우팅 하네스</title>
<style>
  body { margin: 0; background: #1d1d1d; color: #f5f5f5;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  .siteHeader { position: fixed; top: 0; left: 0; right: 0; height: 44px;
    background: #2e2e2e; display: flex; align-items: center; padding: 0 16px;
    font-weight: 700; z-index: 10; }
  main { padding: 60px 16px 24px; }
  #result { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; white-space: pre; }
  .pass { color: #34b27c; } .fail { color: #ec4860; font-weight: 700; }
</style>
</head>
<body>
<header class="siteHeader" id="h1">사이트 fixed 헤더</header>
<main>
  <h1>SPA 라우팅 회귀 하네스</h1>
  <div id="result">검사 중...</div>
</main>

<script>
  const H = 30;
  // 앞선 하네스가 남긴 '이 탭에서 숨김' 상태를 지우고 시작한다
  try { sessionStorage.removeItem('__webEnvBannerDismissed'); } catch (_) {}
  const CFG = {
    settings: {
      enabled: true, position: 'top', height: H, fontSize: 12, speed: 55, direction: 'left',
      gap: 28, showWarning: true, stripes: false,
      pushContent: true, offsetFixed: true, pauseOnHover: true, dismissible: true
    },
    environments: [
      { id: 'l', label: 'LOCAL', enabled: true, bg: '#34b27c', fg: '#0a0a0a',
        patterns: ['localhost', '127.0.0.1', '/^file:\\/\\//'] }
    ]
  };
  window.chrome = {
    runtime: { getURL: (p) => new URL('../' + p, location.href).href },
    storage: {
      sync: { get: () => Promise.resolve({ envBannerConfig: CFG }), set: () => Promise.resolve() },
      onChanged: { addListener() {}, removeListener() {} }
    }
  };
</script>
<script src="../src/lib/messages.js"></script>
<script src="../src/lib/i18n.js"></script>
<script src="../src/lib/icons.js"></script>
<script src="../src/lib/font.js"></script>
<script src="../src/lib/defaults.js"></script>
<script src="../src/lib/match.js"></script>
<script src="../src/lib/store.js"></script>
<script src="../src/lib/banner.js"></script>
<script src="../src/content/content.js"></script>
<script>
  const lines = [];
  let fail = 0;
  const check = (name, cond, extra) => {
    if (!cond) fail++;
    lines.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${extra ? '  → ' + extra : ''}`);
  };
  const flush = () => {
    const el = document.getElementById('result');
    el.textContent = lines.join('\n') + '\n\n' + (fail ? `실패 ${fail}건` : '전체 통과');
    el.className = fail ? 'fail' : 'pass';
    document.title = fail ? `FAIL-${fail}` : 'ALL-PASS';
  };
  const pad = () => getComputedStyle(document.documentElement).paddingTop;
  const topOf = (id) => {
    const el = document.getElementById(id);
    return el ? getComputedStyle(el).top : '(없음)';
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  (async () => {
    await wait(700);
    lines.push('# 1. 초기 렌더');
    check('html padding-top', pad() === H + 'px', pad());
    check('사이트 헤더 top', topOf('h1') === H + 'px', topOf('h1'));

    // 2. 프레임워크 리렌더가 헤더 인라인 스타일을 재설정 (React style prop 갱신 모사)
    lines.push('# 2. 헤더 인라인 스타일 재설정 (리렌더)');
    document.getElementById('h1').style.top = '0px';
    await wait(1400);
    check('헤더 top 재보정', topOf('h1') === H + 'px', topOf('h1'));

    // 3. 사이트 스크립트가 html 인라인 스타일을 리셋 (스크롤락 해제 등)
    lines.push('# 3. html 인라인 스타일 리셋');
    document.documentElement.removeAttribute('style');
    await wait(1400);
    check('html padding-top 복구', pad() === H + 'px', pad());

    // 4. SPA 라우팅: URL 변경 + 헤더 교체
    lines.push('# 4. SPA 라우팅(pushState) + 헤더 교체');
    document.getElementById('h1').remove();
    const h2 = document.createElement('header');
    h2.className = 'siteHeader';
    h2.id = 'h2';
    h2.textContent = '라우팅 후 새 헤더';
    document.body.insertBefore(h2, document.body.firstChild);
    history.pushState({}, '', '?page=2');
    await wait(400);
    check('교체된 헤더 top (400ms 내 즉시 반응)', topOf('h2') === H + 'px', topOf('h2'));
    await wait(1400);
    check('교체된 헤더 top (폴링 후)', topOf('h2') === H + 'px', topOf('h2'));
    check('html padding-top 유지', pad() === H + 'px', pad());

    // 5. 라우팅 후 사이트가 html style 을 통째로 덮어씀
    lines.push('# 5. html style 통째 덮어쓰기 (cssText)');
    document.documentElement.style.cssText = 'background: #1d1d1d';
    await wait(1400);
    check('html padding-top 복구', pad() === H + 'px', pad());

    // 6. 사이트가 보정값과 똑같은 값을 인라인으로 다시 씀 → 누적 증가하면 안 된다
    lines.push('# 6. 보정값과 동일한 값 재설정 (누적 증가 방어)');
    for (let i = 0; i < 5; i++) {
      h2.style.top = H + 'px';
      await wait(120);
    }
    await wait(1400);
    check('헤더 top 그대로', topOf('h2') === H + 'px', topOf('h2'));

    // 7. 사이트가 반복해서 0 으로 되돌리는 경합
    lines.push('# 7. 사이트가 100ms 마다 top 을 0 으로 되돌림');
    let races = 0;
    const racer = setInterval(() => {
      h2.style.top = '0px';
      if (++races >= 12) clearInterval(racer);
    }, 100);
    await wait(2600);
    check('경합 후 헤더 top 수렴', topOf('h2') === H + 'px', topOf('h2'));

    // 8. 유휴 상태에서 확장이 style 을 다시 쓰지 않아야 한다
    lines.push('# 8. 유휴 3초 — 불필요한 재기록 없음');
    let writes = 0;
    const spy = new MutationObserver((recs) => { writes += recs.length; });
    spy.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
    spy.observe(h2, { attributes: true, attributeFilter: ['style'] });
    await wait(3000);
    spy.disconnect();
    check('style 재기록 0건', writes === 0, writes + '건');

    // 9. 매 프레임 DOM 이 바뀌는 페이지 — 상태 유지 + 메인 스레드 여유
    lines.push('# 9. 매 프레임 DOM 변경 스트레스 (2초)');
    const churn = document.createElement('div');
    document.body.appendChild(churn);
    let frames = 0;
    let stop = false;
    const t0 = performance.now();
    (function spin() {
      if (stop) return;
      frames++;
      churn.textContent = 'churn ' + frames;
      churn.style.opacity = frames % 2 ? '0.9' : '1';
      requestAnimationFrame(spin);
    })();
    await wait(2000);
    stop = true;
    const fps = frames / ((performance.now() - t0) / 1000);
    churn.remove();
    check('스트레스 중 배너 상태 유지', pad() === H + 'px' && topOf('h2') === H + 'px',
      pad() + ' / ' + topOf('h2'));
    check('프레임 유지 (≥30fps)', fps >= 30, fps.toFixed(1) + 'fps');

    // 10. 닫기 → 전체 원복
    lines.push('# 10. 닫기 후 원복');
    const host = document.querySelector('web-env-banner-root');
    const closeBtn = host && host.shadowRoot && host.shadowRoot.querySelector('.close');
    check('닫기 버튼 존재', !!closeBtn);
    if (closeBtn) {
      closeBtn.click();
      await wait(1400);
      check('host 제거', !document.querySelector('web-env-banner-root'));
      check('html padding 원복', pad() === '0px', pad());
      check('주입 스타일 제거', !document.getElementById('web-env-banner-push'));
      check('헤더 top 원복', topOf('h2') === '0px', topOf('h2'));
      check('닫은 뒤 되살아나지 않음', !document.querySelector('web-env-banner-root'));
    }

    flush();
  })();
</script>
</body>
</html>
