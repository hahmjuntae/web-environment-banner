<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Environment Banner 미리보기</title>
<style>
  @font-face {
    font-family: 'Pretendard Variable';
    src: url('../assets/fonts/PretendardVariable.woff2') format('woff2');
    font-weight: 400 900;
    font-display: swap;
  }
  * { box-sizing: border-box; border-radius: 0; }
  body {
    margin: 0;
    padding: 60px 24px 80px;
    background: #1d1d1d;
    color: #f5f5f5;
    font: 14px/1.45 'Pretendard Variable', Pretendard, ui-sans-serif, system-ui, sans-serif;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 20px; }
  .label {
    font-size: 12px; font-weight: 500; letter-spacing: 0.025em; color: #9e9e9e;
    margin-top: 12px;
  }
  .row { border: 1px solid #2e2e2e; overflow: hidden; }
</style>
</head>
<body>
<main>
  <h1>Web Environment Banner 미리보기</h1>
  <div id="stage"></div>
</main>

<script src="../src/lib/icons.js"></script>
<script src="../src/lib/font.js"></script>
<script src="../src/lib/defaults.js"></script>
<script src="../src/lib/banner.js"></script>
<script>
  (function () {
    const D = EnvBannerDefaults;
    const stage = document.getElementById('stage');
    const base = Object.assign({}, D.DEFAULT_SETTINGS);

    function row(title, env, settings) {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = title;
      const box = document.createElement('div');
      box.className = 'row';
      const holder = document.createElement('web-env-banner-preview');
      box.appendChild(holder);
      stage.append(label, box);
      EnvBannerUI.mount(holder, { env, settings, mode: 'inline' });
    }

    D.DEFAULT_ENVIRONMENTS.forEach((env) => row(env.label + '  ' + env.bg, env, base));

    row(
      'STAGING  사선 끔 · 높이 28 · 속도 90',
      { id: 's', label: 'STAGING', enabled: true, bg: '#3d8bf5', fg: '#0a0a0a', patterns: [] },
      Object.assign({}, base, { stripes: false, height: 28, fontSize: 12, speed: 90 })
    );

    row(
      'REVIEW  Ink · 경고 아이콘 없음',
      { id: 'r', label: 'REVIEW', enabled: true, bg: '#f5f5f5', fg: '#0a0a0a', patterns: [] },
      Object.assign({}, base, { showWarning: false })
    );

    // 실제 페이지처럼 상단 고정
    const fixedHost = document.createElement('web-env-banner-root');
    document.documentElement.appendChild(fixedHost);
    EnvBannerUI.mount(fixedHost, {
      env: D.DEFAULT_ENVIRONMENTS[2],
      settings: base,
      mode: 'fixed',
      onDismiss: () => fixedHost.remove()
    });
    document.documentElement.style.setProperty('padding-top', base.height + 'px', 'important');
  })();
</script>
</body>
</html>
