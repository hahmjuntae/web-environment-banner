<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>shot3</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    background: #f4f5f7; color: #1f2430;
    font: 14px/1.5 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
  }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 50;
    background: #fff; border-bottom: 1px solid #e3e6ea;
    display: flex; align-items: center; gap: 20px; padding: 0 24px;
  }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
  .brand span { color: #8a91a0; font-weight: 500; }
  .avatar { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; background: #cdd3dc; }
  main { padding: 96px 28px 0; }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .sub { color: #7d8494; font-size: 13px; margin-top: 4px; }
  .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
  .block { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; height: 150px; padding: 16px; }
  .block .k { width: 64px; height: 9px; background: #e8ebef; border-radius: 3px; }
  .block .v { width: 108px; height: 22px; background: #dde2e8; border-radius: 4px; margin-top: 12px; }
  .block .s { width: 100%; height: 56px; background: #f1f3f6; border-radius: 4px; margin-top: 18px; }
  .wide { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; height: 240px;
    margin-top: 14px; padding: 18px 20px; }
  .wide .r { height: 12px; background: #eef0f3; border-radius: 3px; margin-bottom: 16px; }
  .wide .r:nth-child(1) { width: 30%; background: #e2e6eb; }
  .wide .r:nth-child(2) { width: 92%; }
  .wide .r:nth-child(3) { width: 78%; }
  .wide .r:nth-child(4) { width: 85%; }
  .wide .r:nth-child(5) { width: 64%; }

  /* 툴바에서 내려온 팝업 연출 */
  .popup-wrap { position: fixed; top: 46px; right: 26px; z-index: 100; }
  .popup-wrap iframe {
    width: 320px; height: 204px; border: 1px solid #2e2e2e; display: block;
    background: #1d1d1d;
  }
  .pointer {
    position: absolute; top: -7px; right: 26px; width: 14px; height: 14px;
    background: #1d1d1d; border-left: 1px solid #2e2e2e; border-top: 1px solid #2e2e2e;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Acme <span>Console</span></div>
  <div class="avatar"></div>
</header>

<main>
  <h1>대시보드</h1>
  <div class="sub">dev.acme-console.com</div>
  <div class="blocks">
    <div class="block"><div class="k"></div><div class="v"></div><div class="s"></div></div>
    <div class="block"><div class="k"></div><div class="v"></div><div class="s"></div></div>
    <div class="block"><div class="k"></div><div class="v"></div><div class="s"></div></div>
  </div>
  <div class="wide">
    <div class="r"></div><div class="r"></div><div class="r"></div><div class="r"></div><div class="r"></div>
  </div>
</main>

<div class="popup-wrap">
  <div class="pointer"></div>
  <iframe src="popup-frame.html" title="popup"></iframe>
</div>

<script src="../../src/lib/icons.js"></script>
<script src="../../src/lib/defaults.js"></script>
<script src="../../src/lib/banner.js"></script>
<script>
  (function () {
    const settings = Object.assign({}, EnvBannerDefaults.DEFAULT_SETTINGS);
    const env = { id: 'd', label: 'DEVELOPMENT', enabled: true, bg: '#f5a312', fg: '#0a0a0a', patterns: [] };

    const host = document.createElement('web-env-banner-root');
    document.documentElement.appendChild(host);
    EnvBannerUI.mount(host, { env, settings, mode: 'fixed' });

    document.documentElement.style.setProperty('padding-top', settings.height + 'px', 'important');
    document.querySelector('.topbar').style.setProperty('top', settings.height + 'px', 'important');
    host.shadowRoot.querySelector('.track').style.animationPlayState = 'paused';
  })();
</script>
</body>
</html>
