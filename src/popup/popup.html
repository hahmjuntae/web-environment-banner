<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web Environment Banner</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="pop">
  <header class="head">
    <span class="mark" id="mark"></span>
    <strong class="title">Web Environment Banner</strong>
    <label class="toggle" title="Enabled" data-i18n-title="optEnabled">
      <input type="checkbox" id="enabled">
      <span class="toggle-track"><span class="toggle-knob"></span></span>
    </label>
  </header>

  <div class="preview" id="previewFrame" hidden>
    <web-env-banner-preview id="preview"></web-env-banner-preview>
  </div>

  <div class="status" id="status"></div>
  <div class="url mono" id="url"></div>

  <div class="assign" id="assign" hidden>
    <span class="select">
      <select id="patternSelect" class="mono"></select>
      <span class="select-arrow" data-icon="chevronDown"></span>
    </span>
    <div class="assign-row">
      <span class="select">
        <select id="envSelect"></select>
        <span class="select-arrow" data-icon="chevronDown"></span>
      </span>
      <button type="button" id="addBtn" class="btn primary">
        <span class="btn-icon" data-icon="plus"></span><span data-i18n="popAdd">Add</span>
      </button>
    </div>
  </div>

  <button type="button" id="openOptions" class="btn wide">
    <span class="btn-icon" data-icon="sliders"></span><span data-i18n="popSettings">Settings</span>
  </button>
</div>

<script src="../lib/messages.js"></script>
<script src="../lib/i18n.js"></script>
<script src="../lib/icons.js"></script>
<script src="../lib/font.js"></script>
<script src="../lib/defaults.js"></script>
<script src="../lib/match.js"></script>
<script src="../lib/store.js"></script>
<script src="../lib/banner.js"></script>
<script src="popup.js"></script>
</body>
</html>
